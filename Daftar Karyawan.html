<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Karyawan Alam Salero Nusantara</title>
    <!-- Font diatur untuk menggunakan font sistem bawaan HP/Laptop jika offline -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fallback font super aman untuk offline */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #8b0000, #4a0404);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            color: #374151;
        }

        .loader-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #8b0000, #4a0404);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-title {
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            animation: pulse 2s infinite;
        }

        .loader-subtitle {
            color: #fecaca;
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-container {
            width: 100%;
            max-width: 42rem; /* Sekitar 672px */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            padding: 2.5rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .main-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .decorative-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background: linear-gradient(to right, #991b1b, #dc2626, #7f1d1d);
        }

        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
            text-align: center;
        }

        .title {
            font-size: 1.875rem;
            font-weight: 800;
            color: #111827;
            margin-top: 1.5rem;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.25rem;
            font-weight: 700;
            color: #991b1b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        .upload-logo-wrapper {
            position: relative;
            cursor: pointer;
        }

        .logo-preview {
            width: 8rem;
            height: 8rem;
            border-radius: 50%;
            border: 4px solid #fee2e2;
            background-color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .logo-preview:hover {
            transform: scale(1.05);
        }

        .foto-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .foto-preview {
            width: 8rem;
            height: 10rem;
            border-radius: 0.75rem;
            border: 2px dashed #fca5a5;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
            transition: transform 0.2s;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .foto-preview:hover { transform: scale(1.05); }
        .upload-prompt { text-align: center; padding: 1rem; }
        .upload-text { font-size: 0.75rem; font-weight: 600; color: #6b7280; margin-top: 0.25rem; display: block; }
        .hidden-input { display: none; }

        form { display: flex; flex-direction: column; gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
        
        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: #111827;
            background-color: #ffffff;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: #8b0000;
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.2);
        }

        textarea.form-control { resize: vertical; min-height: 80px; }

        .form-control[readonly] {
            background-color: #f3f4f6;
            color: #4b5563;
            font-weight: 600;
            cursor: not-allowed;
            text-align: center;
        }

        .form-control.success-age {
            background-color: #ecfdf5;
            color: #065f46;
            border-color: #6ee7b7;
        }

        /* Grid System (Offline Safe) */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        
        .box-gray {
            background-color: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #f3f4f6;
        }

        .btn-submit {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(to right, #16a34a, #22c55e);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover { background: linear-gradient(to right, #15803d, #16a34a); }
        .btn-submit svg { width: 1.5rem; height: 1.5rem; margin-right: 0.5rem; fill: currentColor; }

        /* Modal Overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.98);
            display: none; /* diubah jadi flex saat aktif via JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 2rem;
            text-align: center;
        }

        .modal.active { display: flex; }

        .modal-icon { width: 5rem; height: 5rem; color: #22c55e; margin-bottom: 1rem; animation: pulse 2s infinite; }
        .modal-title { font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-bottom: 0.5rem; }
        .modal-text { color: #4b5563; margin-bottom: 1.5rem; font-size: 0.875rem; }

        .warning-box {
            background-color: #fefce8;
            border-left: 4px solid #facc15;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            text-align: left;
            align-items: flex-start;
        }

        .warning-icon { width: 1.25rem; height: 1.25rem; color: #facc15; margin-right: 0.75rem; flex-shrink: 0; }
        .warning-text { font-size: 0.875rem; color: #a16207; font-weight: 600; line-height: 1.4; }

        .btn-close {
            padding: 0.5rem 1.5rem;
            background-color: #991b1b;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-close:hover { background-color: #7f1d1d; }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .main-container { padding: 1.5rem; }
            .grid-3 > div:nth-child(3) { margin-top: -0.5rem; } /* Rapatkan umur di HP */
        }
    </style>
</head>
<body>

    <!-- Layar Loading Smooth -->
    <div id="pageLoader" class="loader-overlay">
        <div class="loader-spinner"></div>
        <h2 class="loader-title">ALAM SALERO</h2>
        <p class="loader-subtitle">Menyiapkan formulir...</p>
    </div>

    <!-- Container Utama -->
    <div id="mainContainer" class="main-container">
        
        <div class="decorative-bar"></div>

        <div class="header-section">
            <div class="upload-logo-wrapper">
                <div class="header-section">
    <div class="upload-logo-wrapper">
        <img
            src="logo.png"
            alt="Logo Alam Salero Nusantara"
            class="logo-preview"
            style="display:block; width:100%; height:100%; object-fit:contain;"
        >
    </div>
                </div>
            </div>
            
            <h1 class="title">Daftar Karyawan</h1>
            <h2 class="subtitle">Alam Salero Nusantara</h2>
        </div>

        <!-- FORMULIR UTAMA -->
        <form action="#" method="POST" onsubmit="handleSubmit(event)">
            
            <!-- Upload Pas Foto -->
            <div class="foto-section">
                <label style="color: #991b1b; margin-bottom: 0.75rem;">Pas Foto Karyawan (Wajah)</label>
                <input type="file" id="fotoUpload" accept="image/*" class="hidden-input" onchange="previewFoto(event)">
                <div id="fotoPreview" class="foto-preview" onclick="document.getElementById('fotoUpload').click()">
                    <div id="fotoPrompt" class="upload-prompt">
                        <svg style="width: 2.5rem; height: 2.5rem; color: #fca5a5; margin: 0 auto;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span class="upload-text">Tap Upload Foto</span>
                    </div>
                </div>
            </div>

            <!-- Identitas Diri -->
            <div class="form-group">
                <label for="nama">Nama Lengkap (Sesuai KTP)</label>
                <input id="nama" name="nama" type="text" required class="form-control" placeholder="Contoh: Budi Santoso">
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Lengkap (Domisili)</label>
                <textarea id="alamat" name="alamat" required class="form-control" placeholder="Masukkan alamat lengkap RT/RW"></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="hp">Nomor HP / WhatsApp</label>
                    <input id="hp" name="hp" type="tel" required class="form-control" placeholder="Contoh: 081234567890">
                </div>
                <div class="form-group">
                    <label for="kelamin">Jenis Kelamin</label>
                    <select id="kelamin" name="kelamin" required class="form-control">
                        <option value="" disabled selected>Pilih...</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
            </div>

            <div class="grid-3 box-gray">
                <div class="form-group">
                    <label for="tempat_lahir">Tempat Lahir</label>
                    <input id="tempat_lahir" name="tempat_lahir" type="text" required class="form-control" placeholder="Kota lahir">
                </div>
                <div class="form-group">
                    <label for="tanggal_lahir">Tanggal Lahir</label>
                    <input id="tanggal_lahir" name="tanggal_lahir" type="date" required onchange="hitungUmur()" class="form-control">
                </div>
                <div class="form-group">
                    <label for="umur">Usia Saat Ini</label>
                    <input id="umur" name="umur" type="text" readonly class="form-control" placeholder="- Tahun">
                </div>
            </div>

            <div class="form-group">
                <label for="agama">Agama</label>
                <select id="agama" name="agama" required class="form-control">
                    <option value="" disabled selected>Pilih Agama...</option>
                    <option value="Islam">Islam</option>
                    <option value="Kristen Protestan">Kristen Protestan</option>
                    <option value="Kristen Katolik">Kristen Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                </select>
            </div>

            <!-- Informasi Bank -->
            <div class="grid-2" style="margin-top: 0.5rem;">
                <div class="form-group">
                    <label for="bank">Bank Penggajian</label>
                    <select id="bank" name="bank" required class="form-control">
                        <option value="" disabled selected>Pilih Bank...</option>
                        <option value="BCA">BCA</option>
                        <option value="Mandiri">Bank Mandiri</option>
                        <option value="BNI">BNI</option>
                        <option value="BRI">BRI</option>
                        <option value="BSI">BSI</option>
                        <option value="CIMB">CIMB Niaga</option>
                        <option value="Lainnya">Lainnya...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rekening">Nomor Rekening</label>
                    <input id="rekening" name="rekening" type="number" required class="form-control" placeholder="Nomor rekening">
                </div>
            </div>
            
            <div class="form-group">
                <label for="atas_nama">Nama Pemilik Rekening (Sesuai Buku Tabungan)</label>
                <input id="atas_nama" name="atas_nama" type="text" required class="form-control" placeholder="Contoh: Budi Santoso">
            </div>

            <!-- Tombol Kirim -->
            <button type="submit" class="btn-submit">
                <svg viewBox="0 0 24 24">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                </svg>
                Kirim Data via WhatsApp
            </button>
        </form>
        
        <!-- Modal Sukses (Dialihkan ke WA) -->
        <div id="successModal" class="modal">
            <svg class="modal-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
            <h3 class="modal-title">Mengalihkan ke WhatsApp...</h3>
            <p class="modal-text">Silakan tekan tombol kirim pada aplikasi WhatsApp Anda.</p>
            
            <div class="warning-box">
                <svg class="warning-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                <p class="warning-text">PENTING: Jangan lupa untuk melampirkan (upload) foto wajah secara manual di dalam chat WhatsApp sebelum menekan kirim!</p>
            </div>

            <button onclick="closeModal()" class="btn-close">Kembali & Tambah Data Baru</button>
        </div>

    </div>

    <script>
        // Animasi Pembuka
        window.addEventListener('load', function() {
            const loader = document.getElementById('pageLoader');
            const mainContainer = document.getElementById('mainContainer');
            
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                
                setTimeout(() => {
                    mainContainer.classList.add('show');
                }, 300);
            }, 800);
        });

        // Preview Logo
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            const prompt = document.getElementById('uploadPrompt');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.style.backgroundImage = `url(${e.target.result})`;
                    prompt.style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Preview Foto
        function previewFoto(event) {
            const input = event.target;
            const preview = document.getElementById('fotoPreview');
            const prompt = document.getElementById('fotoPrompt');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.style.backgroundImage = `url(${e.target.result})`;
                    prompt.style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Hitung Umur Otomatis
        function hitungUmur() {
            const inputTanggalLahir = document.getElementById("tanggal_lahir").value;
            const inputUmur = document.getElementById("umur");
            
            if (inputTanggalLahir) {
                const birthDate = new Date(inputTanggalLahir);
                const today = new Date();
                
                let age = today.getFullYear() - birthDate.getFullYear();
                const m = today.getMonth() - birthDate.getMonth();
                
                if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                    age--;
                }
                
                if (age < 0) age = 0;
                
                inputUmur.value = age + " Tahun";
                inputUmur.classList.add('success-age');
            } else {
                inputUmur.value = "";
                inputUmur.classList.remove('success-age');
            }
        }

        // Submit to WhatsApp
        function handleSubmit(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData.entries());
            data.umur = document.getElementById('umur').value;

            let pesanWA = `*DATA KARYAWAN BARU*\n`;
            pesanWA += `*Alam Salero Nusantara*\n\n`;
            pesanWA += `*Nama Lengkap:* ${data.nama}\n`;
            pesanWA += `*Jenis Kelamin:* ${data.kelamin}\n`;
            pesanWA += `*Tempat, Tgl Lahir:* ${data.tempat_lahir}, ${data.tanggal_lahir} (${data.umur})\n`;
            pesanWA += `*Agama:* ${data.agama}\n`;
            pesanWA += `*No HP/WA:* ${data.hp}\n`;
            pesanWA += `*Alamat Lengkap:* ${data.alamat}\n\n`;
            pesanWA += `*(Catatan: Foto wajah harap dikirimkan sebagai lampiran)*\n\n`;
            pesanWA += `*INFORMASI REKENING*\n`;
            pesanWA += `*Bank Penggajian:* ${data.bank}\n`;
            pesanWA += `*No Rekening:* ${data.rekening}\n`;
            pesanWA += `*Atas Nama:* ${data.atas_nama}\n`;

            const nomorWA = "6287738813613";
            const pesanEncoded = encodeURIComponent(pesanWA);
            const urlWhatsApp = `https://wa.me/${nomorWA}?text=${pesanEncoded}`;
            
            window.open(urlWhatsApp, '_blank');
            document.getElementById('successModal').classList.add('active');
        }

        // Tutup Modal & Reset
        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            document.querySelector('form').reset();
            
            const inputUmur = document.getElementById("umur");
            inputUmur.value = "";
            inputUmur.classList.remove('success-age');
            
            document.getElementById('imagePreview').style.backgroundImage = 'none';
            document.getElementById('uploadPrompt').style.display = 'block';
            
            document.getElementById('fotoPreview').style.backgroundImage = 'none';
            document.getElementById('fotoPrompt').style.display = 'block';
            document.getElementById('fotoUpload').value = '';
        }
    </script>
</body>
</html>

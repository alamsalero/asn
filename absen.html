<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi - Alam Salero Nusantara</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .numpad-btn {
            transition: all 0.1s;
        }
        .numpad-btn:active {
            transform: scale(0.9);
            background-color: #e2e8f0;
        }
        
        /* Animasi Toast / Notifikasi */
        #toast {
            visibility: hidden; min-width: 250px; background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px); color: #fff; text-align: center; border-radius: 9999px;
            padding: 12px 24px; position: fixed; z-index: 50; left: 50%;
            transform: translateX(-50%) translateY(20px); bottom: 30px; font-size: 14px; font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); transition: all 0.4s ease; opacity: 0;
        }
        #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); bottom: 40px; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Loading Screen (Saat pertama kali buka web) -->
    <div id="loadingScreen" class="fixed inset-0 bg-white/90 backdrop-blur-md z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative">
            <div class="w-20 h-20 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <i class="fas fa-database text-blue-600 text-xl"></i>
            </div>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-800 mt-6 tracking-tight" id="loadingText">Menghubungkan Server...</h2>
        <p class="text-sm text-slate-500 mt-2 font-medium" id="loadingSubText">Mengunduh data karyawan</p>
    </div>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 w-full max-w-md mx-auto relative z-10">
        
        <!-- ================= MAIN MENU ================= -->
        <div id="mainMenu" class="w-full bg-white/70 backdrop-blur-xl border border-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.06)] p-6 sm:p-8 transition-all duration-300">
            
            <!-- LOGO & HEADER -->
            <div class="flex flex-col items-center mb-8">
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 mb-3 transform hover:scale-105 transition-transform duration-300">
                    <!-- Silakan ganti logo.png dengan nama file logo Anda di Github jika ada -->
                    <img src="logo.png" alt="Logo" class="w-16 h-16 object-contain drop-shadow-sm" id="mainLogo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3063/3063822.png'">
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800 text-center tracking-tight leading-tight">Alam Salero Nusantara</h1>
                <p class="text-xs text-blue-600 font-bold mt-2 bg-blue-50 px-3 py-1 rounded-full border border-blue-100">Sistem Absensi PIN Terpadu</p>
            </div>

            <!-- TOMBOL MENU -->
            <div class="grid grid-cols-1 gap-4">
                <button onclick="showRegister()" class="group relative overflow-hidden bg-white border-2 border-slate-200 hover:border-blue-500 text-slate-700 py-4 rounded-2xl font-bold text-lg flex items-center justify-center transition-all duration-300 hover:shadow-lg hover:-translate-y-1">
                    <i class="fas fa-user-plus mr-3 text-blue-500 group-hover:scale-110 transition-transform duration-300"></i> 
                    <span>1. Daftar PIN Karyawan</span>
                </button>
                
                <button onclick="showAbsen('masuk')" class="group relative overflow-hidden bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white py-4 rounded-2xl font-bold text-lg flex items-center justify-center transition-all duration-300 shadow-md hover:shadow-[0_10px_20px_rgba(16,185,129,0.3)] hover:-translate-y-1">
                    <i class="fas fa-sign-in-alt mr-3 group-hover:translate-x-1 transition-transform duration-300"></i> 
                    <span>2. Absen Masuk</span>
                </button>
                
                <button onclick="showAbsen('pulang')" class="group relative overflow-hidden bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-400 hover:to-red-500 text-white py-4 rounded-2xl font-bold text-lg flex items-center justify-center transition-all duration-300 shadow-md hover:shadow-[0_10px_20px_rgba(244,63,94,0.3)] hover:-translate-y-1">
                    <i class="fas fa-sign-out-alt mr-3 group-hover:translate-x-1 transition-transform duration-300"></i> 
                    <span>3. Absen Pulang</span>
                </button>
            </div>
            
            <!-- STATUS KONEKSI -->
            <div class="mt-8 pt-5 border-t border-slate-200/60 flex flex-col items-center">
                <div class="text-xs font-bold text-slate-500 flex items-center">
                    <i class="fas fa-cloud-check mr-2 text-blue-500"></i> Database PIN Aktif (<span id="userCount" class="mx-1 text-blue-600">0</span> Karyawan)
                </div>
                <button onclick="syncDataFromCloud()" class="mt-3 text-[10px] text-slate-400 hover:text-blue-500 transition-colors flex items-center">
                    <i class="fas fa-sync-alt mr-1"></i> Sinkronkan Ulang Data
                </button>
            </div>
        </div>

        <!-- ================= FORM DAFTAR KARYAWAN ================= -->
        <div id="registerView" class="hidden w-full bg-white/80 backdrop-blur-xl border border-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.06)] p-6 sm:p-8 transition-all flex flex-col">
            
            <div class="w-full flex justify-between items-center mb-6">
                <div class="flex items-center">
                    <div class="bg-blue-100 p-2 rounded-lg mr-3 text-blue-600"><i class="fas fa-user-plus"></i></div>
                    <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">Daftar Karyawan</h2>
                </div>
                <button onclick="returnToMenu()" class="text-slate-400 hover:text-red-500 bg-white hover:bg-red-50 shadow-sm border border-slate-100 rounded-full w-10 h-10 flex items-center justify-center transition-all hover:scale-105">
                    <i class="fas fa-times fa-lg"></i>
                </button>
            </div>

            <!-- Input Fields -->
            <div class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="regName" placeholder="Contoh: Budi Santoso" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-slate-700">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Divisi / Jabatan</label>
                    <select id="regJabatan" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-slate-700 appearance-none">
                        <option value="" disabled selected>Pilih Divisi...</option>
                        <option value="KITCHEN (Chef, Helper Chef)">KITCHEN (Chef, Helper Chef)</option>
                        <option value="FRONT OFFICE (Palung, Kasir, Waiters, Jusbar, Martabak/Sate)">FRONT OFFICE (Palung, Kasir, Waiters, Jusbar, Martabak/Sate)</option>
                        <option value="OPERATION (Delivery, Cleaning Service, Security, General Affairs)">OPERATION (Delivery, Cleaning Service, Security, General Affairs)</option>
                        <option value="BACK OFFICE (Admin, Finance/Accounting, HRD)">BACK OFFICE (Admin, Finance/Accounting, HRD)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">No HP / WhatsApp</label>
                    <input type="tel" id="regPhone" placeholder="Contoh: 0812345678" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-slate-700">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Cabang</label>
                    <select id="regLocation" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-semibold text-slate-700 appearance-none">
                        <option value="" disabled selected>Pilih Cabang...</option>
                        <option value="POLDA METRO JAYA">POLDA METRO JAYA</option>
                        <option value="THE BREEZE BSD">THE BREEZE BSD</option>
                        <option value="THAMRIN CITY">THAMRIN CITY</option>
                        <option value="ROA MALAKA">ROA MALAKA</option>
                        <option value="CENTRAL PARK">CENTRAL PARK</option>
                        <option value="CILEDUG">CILEDUG</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Buat PIN (4-6 Angka)</label>
                    <input type="password" id="regPin" placeholder="Buat PIN Rahasia" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-extrabold tracking-[0.3em] text-slate-700 text-center text-lg">
                </div>
            </div>

            <button onclick="submitRegister()" id="btnSubmitReg" class="w-full mt-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg flex items-center justify-center transition-all hover:-translate-y-1">
                <i class="fas fa-save mr-2"></i> Simpan Karyawan
            </button>
        </div>

        <!-- ================= NUMPAD ABSENSI (KASIR) ================= -->
        <div id="absenView" class="hidden w-full bg-white/80 backdrop-blur-xl border border-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.06)] p-6 transition-all flex flex-col items-center">
            
            <div class="w-full flex justify-between items-center mb-4">
                <div class="flex items-center">
                    <div id="absenIconBox" class="p-2 rounded-lg mr-3 text-white"><i id="absenIcon" class="fas"></i></div>
                    <h2 id="absenTitle" class="text-xl font-extrabold text-slate-800 tracking-tight">Judul</h2>
                </div>
                <button onclick="returnToMenu()" class="text-slate-400 hover:text-red-500 bg-white hover:bg-red-50 shadow-sm border border-slate-100 rounded-full w-10 h-10 flex items-center justify-center transition-all hover:scale-105">
                    <i class="fas fa-times fa-lg"></i>
                </button>
            </div>

            <!-- Layar Numpad -->
            <div class="w-full mb-6">
                <p class="text-center text-sm text-slate-500 mb-2 font-bold">Masukkan PIN Rahasia Anda</p>
                <div class="w-full bg-slate-100 border-2 border-slate-200 h-16 rounded-xl flex items-center justify-center">
                    <input type="password" id="displayPin" readonly class="bg-transparent w-full text-center text-3xl font-extrabold tracking-[0.5em] text-slate-800 outline-none placeholder-slate-300" placeholder="••••">
                </div>
            </div>

            <!-- Tombol Numpad -->
            <div class="grid grid-cols-3 gap-3 w-full max-w-[280px]">
                <button onclick="typePin('1')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">1</button>
                <button onclick="typePin('2')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">2</button>
                <button onclick="typePin('3')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">3</button>
                
                <button onclick="typePin('4')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">4</button>
                <button onclick="typePin('5')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">5</button>
                <button onclick="typePin('6')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">6</button>
                
                <button onclick="typePin('7')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">7</button>
                <button onclick="typePin('8')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">8</button>
                <button onclick="typePin('9')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">9</button>
                
                <button onclick="clearPin()" class="numpad-btn bg-rose-50 border border-rose-200 text-rose-500 font-bold text-xl py-4 rounded-xl shadow-sm hover:bg-rose-100">C</button>
                <button onclick="typePin('0')" class="numpad-btn bg-white border border-slate-200 text-slate-700 font-bold text-2xl py-4 rounded-xl shadow-sm hover:shadow-md">0</button>
                <button onclick="verifyPinAndAbsen()" id="btnSubmitAbsen" class="numpad-btn bg-blue-500 border border-blue-600 text-white font-bold text-xl py-4 rounded-xl shadow-sm hover:bg-blue-600"><i class="fas fa-check"></i></button>
            </div>
        </div>

    </main>

    <!-- Elemen Toast untuk pesan peringatan/sukses -->
    <div id="toast">Notifikasi</div>

    <script>
        // =========================================================================
        // 🔴 PASTE URL WEB APP DARI GOOGLE APPS SCRIPT ANDA DI BAWAH SINI 🔴
        // =========================================================================
        const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDprCZo92-nq-AP33DoJsI6tsqMPVhVOn9LoMLBezRYwatXLmjIZDgwfHqzk5T8U5ihg/exec";
        
        let employeeData = []; 
        let currentMode = ''; 
        let currentPin = '';
        let isProcessing = false;

        // Dijalankan saat web pertama kali dibuka
        async function init() {
            await syncDataFromCloud();
        }

        // --- FETCH DATA PIN KARYAWAN DARI GOOGLE SHEETS ---
        async function syncDataFromCloud() {
            document.getElementById('loadingScreen').classList.remove('hidden');
            try {
                const response = await fetch(APPSCRIPT_URL);
                const data = await response.json();
                employeeData = data; // Simpan data ke memory lokal perangkat
                
                document.getElementById('userCount').textContent = employeeData.length;
                document.getElementById('loadingScreen').classList.add('hidden');
                showToast("Database PIN sinkron!", "success");
            } catch (error) {
                console.error("Gagal sinkron:", error);
                document.getElementById('loadingScreen').classList.add('hidden');
                showToast("Gagal mengambil data. Cek koneksi internet.", "error");
            }
        }

        // --- SISTEM NAVIGASI (PINDAH-PINDAH LAYAR) ---
        function returnToMenu() {
            document.getElementById('registerView').classList.add('hidden');
            document.getElementById('absenView').classList.add('hidden');
            document.getElementById('mainMenu').classList.remove('hidden');
            clearPin();
        }

        function showRegister() {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('registerView').classList.remove('hidden');
            
            // Mengosongkan form saat layar dibuka
            document.getElementById('regName').value = '';
            document.getElementById('regJabatan').value = '';
            document.getElementById('regPhone').value = '';
            document.getElementById('regLocation').value = '';
            document.getElementById('regPin').value = '';
        }

        function showAbsen(tipe) {
            if (employeeData.length === 0) {
                showToast("Database kosong! Belum ada karyawan terdaftar.", "error");
                return;
            }
            currentMode = tipe;
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('absenView').classList.remove('hidden');
            
            const titleEl = document.getElementById('absenTitle');
            const iconBox = document.getElementById('absenIconBox');
            const iconEl = document.getElementById('absenIcon');
            
            if (tipe === 'masuk') {
                titleEl.textContent = "Absen Masuk";
                iconBox.className = "p-2 rounded-lg mr-3 text-white bg-emerald-500 shadow-md shadow-emerald-200";
                iconEl.className = "fas fa-sign-in-alt";
            } else {
                titleEl.textContent = "Absen Pulang";
                iconBox.className = "p-2 rounded-lg mr-3 text-white bg-rose-500 shadow-md shadow-rose-200";
                iconEl.className = "fas fa-sign-out-alt";
            }
            clearPin();
        }

        // --- LOGIKA NUMPAD KASIR ---
        function typePin(num) {
            if (currentPin.length < 6) { // Maksimal 6 angka
                currentPin += num;
                document.getElementById('displayPin').value = currentPin;
            }
        }

        function clearPin() {
            currentPin = '';
            document.getElementById('displayPin').value = '';
        }

        // --- PROSES SIMPAN KARYAWAN BARU KE SPREADSHEET ---
        async function submitRegister() {
            const name = document.getElementById('regName').value.trim();
            const jabatan = document.getElementById('regJabatan').value;
            const phone = document.getElementById('regPhone').value.trim();
            const location = document.getElementById('regLocation').value;
            const pin = document.getElementById('regPin').value.trim();

            // Validasi Input
            if (!name || !jabatan || !phone || !location || !pin) {
                showToast("Semua kolom wajib diisi!", "error"); return;
            }
            if (pin.length < 4) {
                showToast("PIN minimal 4 angka!", "error"); return;
            }

            // Validasi: Cek apakah PIN sudah pernah dipakai karyawan lain
            const isPinExist = employeeData.find(emp => emp.pin === pin);
            if (isPinExist) {
                showToast("PIN sudah dipakai karyawan lain. Buat PIN unik!", "error"); return;
            }

            if (isProcessing) return;
            isProcessing = true;
            
            const btn = document.getElementById('btnSubmitReg');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Menyimpan...';

            const timestamp = new Date().toLocaleString('id-ID');
            const payload = {
                action: "register",
                waktu: timestamp,
                nama: name,
                jabatan: jabatan,
                nohp: phone,
                lokasi: location,
                pin: pin
            };

            try {
                await fetch(APPSCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                showToast(`Karyawan ${name} berhasil didaftarkan!`, "success");
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> Simpan Karyawan';
                isProcessing = false;
                
                returnToMenu();
                syncDataFromCloud(); // Memanggil ulang data agar PIN baru bisa langsung digunakan
            } catch (error) {
                console.error(error);
                showToast("Gagal mendaftar ke server.", "error");
                btn.innerHTML = '<i class="fas fa-save mr-2"></i> Simpan Karyawan';
                isProcessing = false;
            }
        }

        // --- PROSES ABSENSI (KIRIM DATA LOG ABSENSI) ---
        async function verifyPinAndAbsen() {
            if (currentPin.length < 4) {
                showToast("Masukkan PIN dengan lengkap!", "error"); return;
            }
            
            // Mencari karyawan berdasarkan PIN yang diketik
            const user = employeeData.find(emp => emp.pin === currentPin);
            
            if (!user) {
                showToast("PIN Salah atau Tidak Terdaftar!", "error");
                clearPin();
                return;
            }

            if (isProcessing) return;
            isProcessing = true;
            
            const btn = document.getElementById('btnSubmitAbsen');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            const timestamp = new Date().toLocaleString('id-ID');
            const payload = {
                action: "absensi",
                waktu: timestamp,
                nama: user.nama,
                jabatan: user.jabatan,
                lokasi: user.lokasi,
                tipe: currentMode // "masuk" atau "pulang"
            };

            try {
                await fetch(APPSCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                showToast(`Halo ${user.nama}, Absen ${currentMode} Berhasil!`, "success");
                btn.innerHTML = '<i class="fas fa-check"></i>';
                isProcessing = false;
                
                // Menunggu 1.5 detik agar pengguna bisa membaca pesan berhasil, lalu kembali ke menu
                setTimeout(() => { returnToMenu(); }, 1500);
            } catch (error) {
                console.error(error);
                showToast("Gagal mengirim absensi ke server.", "error");
                btn.innerHTML = '<i class="fas fa-check"></i>';
                isProcessing = false;
            }
        }

        // --- FUNGSI MENAMPILKAN PESAN SINGKAT (TOAST) ---
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            // Ganti warna berdasarkan tipe pesan
            toast.style.backgroundColor = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#3b82f6';
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Mulai aplikasi
        window.onload = init;
    </script>
</body>
</html>

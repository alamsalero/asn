<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Karyawan Alam Salero Nusantara</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #8b0000, #4a0404);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            color: #374151;
        }

        .loader-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #8b0000, #4a0404);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-title {
            color: white;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            animation: pulse 2s infinite;
        }

        .loader-subtitle {
            color: #fecaca;
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-container {
            width: 100%;
            max-width: 42rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            padding: 2.5rem;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .main-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .decorative-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            background: linear-gradient(to right, #991b1b, #dc2626, #7f1d1d);
        }

        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
            text-align: center;
        }

        .title {
            font-size: 1.875rem;
            font-weight: 800;
            color: #111827;
            margin-top: 1.5rem;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.25rem;
            font-weight: 700;
            color: #991b1b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        .upload-logo-wrapper {
            position: relative;
            cursor: pointer;
        }

        .logo-preview {
            width: 8rem;
            height: 8rem;
            border-radius: 50%;
            border: 4px solid #fee2e2;
            background-color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .logo-preview:hover {
            transform: scale(1.05);
        }

        .upload-prompt { text-align: center; padding: 1rem; }
        .upload-text { font-size: 0.75rem; font-weight: 600; color: #6b7280; margin-top: 0.25rem; display: block; }
        .hidden-input { display: none; }

        form { display: flex; flex-direction: column; gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
        
        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: #111827;
            background-color: #ffffff;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: #8b0000;
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.2);
        }

        textarea.form-control { resize: vertical; min-height: 80px; }

        .form-control[readonly] {
            background-color: #f3f4f6;
            color: #4b5563;
            font-weight: 600;
            cursor: not-allowed;
            text-align: center;
        }

        .form-control.success-age {
            background-color: #ecfdf5;
            color: #065f46;
            border-color: #6ee7b7;
        }

        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        
        .box-gray {
            background-color: #f9fafb;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #f3f4f6;
        }

        .btn-submit {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(to right, #991b1b, #b91c1c);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover { background: linear-gradient(to right, #7f1d1d, #991b1b); }
        .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; }

        /* Modal Overlay */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 2rem;
            text-align: center;
        }

        .modal.active { display: flex; }

        .modal-icon { width: 5rem; height: 5rem; color: #22c55e; margin-bottom: 1rem; animation: pulse 2s infinite; }
        .modal-title { font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-bottom: 0.5rem; }
        .modal-text { color: #4b5563; margin-bottom: 1.5rem; font-size: 0.875rem; line-height: 1.5; }

        .btn-close {
            padding: 0.5rem 1.5rem;
            background-color: #111827;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-close:hover { background-color: #374151; }

        @media (max-width: 640px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .main-container { padding: 1.5rem; }
            .grid-3 > div:nth-child(3) { margin-top: -0.5rem; }
        }
    </style>
</head>
<body>

    <div id="pageLoader" class="loader-overlay">
        <div class="loader-spinner"></div>
        <h2 class="loader-title">ALAM SALERO</h2>
        <p class="loader-subtitle">Menyiapkan sistem database...</p>
    </div>

    <div id="mainContainer" class="main-container">
        <div class="decorative-bar"></div>

        <div class="header-section">
            <div class="upload-logo-wrapper" title="Klik untuk ganti logo jika diperlukan">
                <input type="file" id="logoUpload" accept="image/*" class="hidden-input" onchange="previewImage(event)">
                
                <!-- BACKGROUND LOGO.PNG DITERAPKAN DI SINI -->
                <div id="imagePreview" class="logo-preview" style="background-image: url('logo.png');" onclick="document.getElementById('logoUpload').click()">
                    
                    <!-- PROMPT DISEMBUNYIKAN KARENA LOGO SUDAH ADA -->
                    <div id="uploadPrompt" class="upload-prompt" style="display: none;">
                        <svg style="width: 2rem; height: 2rem; color: #b91c1c; margin: 0 auto;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        <span class="upload-text">Pilih Logo</span>
                    </div>
                </div>
            </div>
            
            <h1 class="title">Daftar Karyawan</h1>
            <h2 class="subtitle">Alam Salero Nusantara</h2>
        </div>

        <form name="karyawan-form" onsubmit="handleSubmit(event)">
            
            <div class="form-group">
                <label for="nama">Nama Lengkap (Sesuai KTP)</label>
                <input id="nama" name="nama" type="text" required class="form-control" placeholder="Contoh: Budi Santoso">
            </div>

            <div class="form-group">
                <label for="alamat">Alamat Lengkap (Domisili)</label>
                <textarea id="alamat" name="alamat" required class="form-control" placeholder="Masukkan alamat lengkap RT/RW"></textarea>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="hp">Nomor HP / WhatsApp</label>
                    <input id="hp" name="hp" type="tel" required class="form-control" placeholder="Contoh: 081234567890">
                </div>
                <div class="form-group">
                    <label for="kelamin">Jenis Kelamin</label>
                    <select id="kelamin" name="kelamin" required class="form-control">
                        <option value="" disabled selected>Pilih...</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
            </div>

            <div class="grid-3 box-gray">
                <div class="form-group">
                    <label for="tempat_lahir">Tempat Lahir</label>
                    <input id="tempat_lahir" name="tempat_lahir" type="text" required class="form-control" placeholder="Kota lahir">
                </div>
                <div class="form-group">
                    <label for="tanggal_lahir">Tanggal Lahir</label>
                    <input id="tanggal_lahir" name="tanggal_lahir" type="date" required onchange="hitungUmur()" class="form-control">
                </div>
                <div class="form-group">
                    <label for="umur">Usia Saat Ini</label>
                    <input id="umur" name="umur" type="text" readonly class="form-control" placeholder="- Tahun">
                </div>
            </div>

            <div class="form-group">
                <label for="agama">Agama</label>
                <select id="agama" name="agama" required class="form-control">
                    <option value="" disabled selected>Pilih Agama...</option>
                    <option value="Islam">Islam</option>
                    <option value="Kristen Protestan">Kristen Protestan</option>
                    <option value="Kristen Katolik">Kristen Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                </select>
            </div>

            <div class="grid-2" style="margin-top: 0.5rem;">
                <div class="form-group">
                    <label for="bank">Bank Penggajian</label>
                    <select id="bank" name="bank" required class="form-control">
                        <option value="" disabled selected>Pilih Bank...</option>
                        <option value="BCA">BCA</option>
                        <option value="Mandiri">Bank Mandiri</option>
                        <option value="BNI">BNI</option>
                        <option value="BRI">BRI</option>
                        <option value="BSI">BSI</option>
                        <option value="CIMB">CIMB Niaga</option>
                        <option value="Lainnya">Lainnya...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rekening">Nomor Rekening</label>
                    <input id="rekening" name="rekening" type="number" required class="form-control" placeholder="Nomor rekening">
                </div>
            </div>
            
            <div class="form-group">
                <label for="atas_nama">Nama Pemilik Rekening (Sesuai Buku Tabungan)</label>
                <input id="atas_nama" name="atas_nama" type="text" required class="form-control" placeholder="Contoh: Budi Santoso">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                Simpan & Kirim Data
            </button>
        </form>
        
        <div id="successModal" class="modal">
            <svg class="modal-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h3 class="modal-title">Pendaftaran Berhasil!</h3>
            <p class="modal-text">Terima kasih, data karyawan telah otomatis tersimpan ke dalam database / sistem Excel perusahaan secara realtime.</p>
            <button onclick="closeModal()" class="btn-close">Tutup & Tambah Data Baru</button>
        </div>

    </div>

    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('pageLoader');
            const mainContainer = document.getElementById('mainContainer');
            
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                setTimeout(() => { mainContainer.classList.add('show'); }, 300);
            }, 800);
        });

        function previewImage(event) {
            const input = event.target;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').style.backgroundImage = `url(${e.target.result})`;
                    document.getElementById('uploadPrompt').style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function hitungUmur() {
            const inputTanggalLahir = document.getElementById("tanggal_lahir").value;
            const inputUmur = document.getElementById("umur");
            
            if (inputTanggalLahir) {
                const birthDate = new Date(inputTanggalLahir);
                const today = new Date();
                let age = today.getFullYear() - birthDate.getFullYear();
                const m = today.getMonth() - birthDate.getMonth();
                
                if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) { age--; }
                if (age < 0) age = 0;
                
                inputUmur.value = age + " Tahun";
                inputUmur.classList.add('success-age');
            } else {
                inputUmur.value = "";
                inputUmur.classList.remove('success-age');
            }
        }

        // --- PASTE URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI ---
        const scriptURL = 'URL_APPS_SCRIPT_ANDA_DISINI'; 

        function handleSubmit(event) {
            event.preventDefault();
            
            if(scriptURL === 'URL_APPS_SCRIPT_ANDA_DISINI') {
                alert("PENTING: Anda belum memasukkan URL Google Apps Script pada kode HTML! Data belum bisa terkirim ke Excel.");
                return;
            }

            const form = document.forms['karyawan-form'];
            const btn = document.getElementById('submitBtn');
            const originalBtnText = btn.innerHTML;
            
            // Animasi Loading Tombol
            btn.innerHTML = 'Menyimpan ke Database...';
            btn.disabled = true;

            const formData = new FormData(form);
            // Paksa masukin data umur (karena field readonly kadang tidak terbawa)
            formData.append('umur', document.getElementById('umur').value);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    document.getElementById('successModal').classList.add('active');
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert("Terjadi kesalahan saat mengirim data. Pastikan internet Anda stabil.");
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                });
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            document.forms['karyawan-form'].reset();
            
            const inputUmur = document.getElementById("umur");
            inputUmur.value = "";
            inputUmur.classList.remove('success-age');
        }
    </script>
</body>
</html>
